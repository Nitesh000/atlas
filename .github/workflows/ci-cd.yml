name: CI/CD Pipeline

on:
  push:
    branches: ["prod"]
  pull_request:
    branches: ["prod"]

jobs:
  ci:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  deploy:
    name: Trigger Deployments
    needs: ci
    # Only run deployments when changes are pushed to production
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Native GitHub Deployments (Render & Vercel)
        run: |
          echo "API & Scraper (Render) and Frontends (Vercel) are handled natively via their GitHub integrations."
          echo "Ensure both Vercel and Render are connected to your repository and set to auto-deploy on the 'prod' branch."
